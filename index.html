<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הקישורים שלי</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- פרופיל -->
        <div class="profile">
            <div class="avatar-container">
                <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">
                <span class="live-badge">LIVE</span>
            </div>
            <h1>השם שלך</h1>
            <p class="username">@username</p>
            <p class="bio">ברוכים הבאים לעמוד הקישורים שלי! תעקבו ותשארו מעודכנים 👇</p>
        </div>

        <!-- כפתורי קישורים -->
        <div class="links">
            <a href="https://kick.com" target="_blank" class="link-card kick">
                <div class="link-info">
                    <span class="badge">LIVE NOW</span>
                    <h2>Kick</h2>
                    <p>שידורים חיים כל שבוע</p>
                </div>
            </a>

            <a href="https://discord.com" target="_blank" class="link-card discord">
                <div class="link-info">
                    <span class="badge">COMMUNITY</span>
                    <h2>Discord</h2>
                    <p>שרת הדיסקורד הרשמי שלנו</p>
                </div>
            </a>

            <a href="https://instagram.com" target="_blank" class="link-card instagram">
                <div class="link-info">
                    <span class="badge">STORIES</span>
                    <h2>Instagram</h2>
                    <p>תמונות ועדכונים שוטפים</p>
                </div>
            </a>

            <a href="https://tiktok.com" target="_blank" class="link-card tiktok">
                <div class="link-info">
                    <span class="badge">CLIPS</span>
                    <h2>TikTok</h2>
                    <p>סרטונים קצרים וקליפים</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
